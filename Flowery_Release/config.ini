# ==============================================================================
#                      FLOWERY (GLUE) — НАСТРОЙКИ КОНФИГУРАЦИИ
# ==============================================================================

[proxy]
# Адрес и порт локального HTTP CONNECT прокси
host = 127.0.0.1
port = 8118
# Автоматическая привязка системного прокси Windows (включает для Chrome, Discord, Edge и др.)
auto_system_proxy = true

# Режим для Discord:
# true  — Flowery САМ полностью обходит блокировку Discord (TLS Record Fragmentation + Happy Eyeballs).
#         ВКЛЮЧИТЕ ЭТО, ЕСЛИ ZAPRET НЕ РАБОТАЕТ НА ДИСКОРД У ВАС ИЛИ ВАШЕГО ДРУГА!
# false — Исключить Discord из прокси Flowery и передать его в zapret (на уровне WinDivert).
proxy_discord = true

# Режим для YouTube:
# true  — Flowery САМ обходит блокировку YouTube (TCP Split split_pos=40). Работает автономно БЕЗ zapret!
# false — Исключить YouTube из прокси Flowery и отдать в zapret
proxy_youtube = true

# Таймаут соединений в секундах
timeout = 15
# Размер буфера сокетов (байт)
buffer_size = 16384

[bypass]
# 1. TCP Split: фрагментация первого пакета ClientHello
tcp_split = true

# 2. TLS Record Fragmentation: разбиение одного ClientHello на несколько TLS Record
# (самая мощная proxy-level техника против блокировок Discord, YouTube и ТСПУ / DPI)
tls_record_frag = true

# 3. OOB Urgent Data: отправка 1 байта через TCP Urgent (MSG_OOB) на позиции SNI
oob_data = true

# 4. HTTP Host Header Obfuscation: замена регистра 'Host:' -> 'hoSt:' для HTTP
http_host_obfuscation = true

[fragmentation]
# Размер первого TCP фрагмента (байт)
fragment_size = 3
# Задержка между отправкой фрагментов (в секундах, 0.005 = 5 миллисекунд)
fragment_delay = 0.005
# Разрезать TLS Record строго по позиции SNI
tlsrec_split_at_sni = true

[tethering]
# Фиксация TTL для обхода ограничений мобильных операторов при раздаче интернета
fix_ttl = true
# 65: при прохождении через смартфон убавляется на 1 и оператор видит TTL=64 (как со смартфона)
default_ttl = 65
# Включение RFC 1323 TCP Timestamps
enable_timestamps = true

[quic]
# Блокировка исходящего UDP 443 (QUIC) через Windows Firewall
# ВНИМАНИЕ: Для Discord voice (войсы) рекомендуется false, чтобы не блокировать WebRTC на порту 443!
block_quic = false

[dns]
# Резервные защищенные DNS серверы
primary = 1.1.1.1
secondary = 8.8.8.8
enable_custom_dns = false

[whitelist_bypass]
# Автоматическое определение типа ограничений (тетеринг vs черный список vs белый список)
auto_detect = true
# Подмена SNI на доверенный домен (для Discord и обычных сайтов отключено, чтобы не ломать TLS)
spoof_sni = false
whitelisted_sni = gosuslugi.ru
# Отправка фейкового TLS Record отключена по умолчанию, так как Cloudflare/Discord отклоняют её фатальной ошибкой
fake_sni_record = false

[targets]
# Имя файла со списком доменов для обхода (располагается в корневой папке)
# Поддерживает точные домены (x.com), поддомены (*.discord.gg), комментарии (#)
whitelist_file = whitelist.txt

# Режим обработки целевых доменов:
# false — Глобальный обход: DPI bypass применяется ко всем сайтам,
#         а домены из whitelist.txt имеют повышенный приоритет и явно логируются в консоли.
# true  — Строгий режим: обход активируется ТОЛЬКО для доменов из whitelist.txt и Discord,
#         все остальные сайты идут напрямую без модификаций трафика.
only_target_domains = false
