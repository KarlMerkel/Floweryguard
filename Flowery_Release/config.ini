[proxy]
host = 127.0.0.1
port = 8118
auto_system_proxy = true
proxy_discord = true
discord_voice_udp = true
proxy_youtube = true
timeout = 15
buffer_size = 131072
early_connect = true

[bypass]
tcp_split = true
tls_record_frag = true
oob_data = false
http_host_obfuscation = true
strip_ech = false
tls_padding = false

[fragmentation]
fragment_size = 3
fragment_delay = 0.001
tlsrec_split_at_sni = true

[tethering]
fix_ttl = true
default_ttl = 65
enable_timestamps = true
mask_user_agent = true
ncsi_spoof = true
clamp_mss = true
target_mtu = 1420

[quic]
block_quic = true

[dns]
enable_custom_dns = false
server = Quad9
primary = 9.9.9.9
secondary = 149.112.112.112
doh_url = https://dns.quad9.net/dns-query
doh_name = Quad9

[whitelist_bypass]
auto_detect = false
spoof_sni = false
whitelisted_sni = gosuslugi.ru
fake_sni_record = false

[mode]
kind = proxy

[targets]
whitelist_file = whitelist.txt
only_target_domains = false
use_hosts_file = false

[strategy]
auto_strategy = true
default_strategy = combo_tlsrec_tcpsplit

[desync]
enabled = true
fooling = badsum
autottl = true
autottl_delta = 2
ttl = 8
repeats = 2
tcp_fake_desync = false
fake_tls_file = tls_clienthello_www_google_com.bin

[support]
report_transport = gateway
report_gateway_url = https://tight-wildflower-7839.hoi4-hours-discord-bot.workers.dev/report
telegram_bot_token = 
telegram_chat_id = 
discord_webhook_url = 

